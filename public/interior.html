<head>

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --cream: #f8f5f0; --warm-white: #fdfbf8;
      --dark: #1a1713; --mid: #5c5449;
      --gold: #b8956a; --gold-light: #d4b48a;
      --line: rgba(26,23,19,0.1);
    }
    html { scroll-behavior: smooth; }
    body { background: var(--warm-white); color: var(--dark); font-family: 'Jost', sans-serif; font-weight: 300; overflow-x: hidden; }

    #preloader { position: fixed; inset: 0; background: var(--dark); display: flex; align-items: center; justify-content: center; z-index: 9999; transition: opacity 0.8s ease; }
    #preloader video { width: 160px; }

    .site-header { position: sticky; top: 0; z-index: 100; background: var(--warm-white); border-bottom: 1px solid var(--line); display: flex; align-items: center; justify-content: space-between; padding: 0 40px; height: 70px; }
    .logo-wrap { display: flex; align-items: center; gap: 14px; text-decoration: none; color: inherit; }
    .logo-wrap video { height: 46px; width: auto; }
    .logo-text { font-family: 'Cormorant Garamond', serif; font-size: 1.35rem; font-weight: 400; letter-spacing: 0.06em; color: var(--dark); }
    .logo-sub { font-size: 0.65rem; letter-spacing: 0.22em; text-transform: uppercase; color: var(--mid); display: block; line-height: 1; }
    nav { display: flex; align-items: center; gap: 0; }
    nav a { padding: 0 20px; font-size: 0.78rem; letter-spacing: 0.15em; text-transform: uppercase; color: var(--mid); text-decoration: none; font-weight: 400; transition: color 0.25s; border-left: 1px solid var(--line); height: 70px; display: flex; align-items: center; }
    nav a:hover { color: var(--gold); }
    nav a.active { color: var(--dark); }
    nav a.cta { background: var(--dark); color: var(--cream); border-left: none; margin-left: 10px; padding: 0 22px; height: 38px; border-radius: 2px; font-size: 0.72rem; }
    nav a.cta:hover { background: var(--gold); }

    .page-hero { padding: 60px 40px 20px; max-width: 1300px; margin: 0 auto; }
    .page-hero-label { font-size: 0.68rem; letter-spacing: 0.25em; text-transform: uppercase; color: var(--gold); display: flex; align-items: center; gap: 10px; margin-bottom: 14px; }
    .page-hero-label::after { content: ''; width: 40px; height: 1px; background: var(--gold); }
    .page-hero h1 { font-family: 'Cormorant Garamond', serif; font-size: clamp(2.5rem, 5vw, 4rem); font-weight: 300; line-height: 1.1; }
    .page-hero h1 em { font-style: italic; color: var(--gold); }

    .wrap { max-width: 1300px; margin: 32px auto; padding: 0 40px 60px; }
    .masonry-gallery { column-count: 3; column-gap: 16px; }
    .masonry-item { break-inside: avoid; margin-bottom: 16px; border-radius: 4px; overflow: hidden; position: relative; }
    .masonry-item img { width: 100%; display: block; cursor: pointer; transition: transform 0.4s ease; }
    .masonry-item:hover img { transform: scale(1.04); }

    @media (max-width: 900px) { .masonry-gallery { column-count: 2; } }
    @media (max-width: 700px) {
      .site-header { padding: 0 12px; height: 56px; }
      .logo-wrap video { height: 30px; }
      .logo-text { font-size: 1rem; }
      .logo-sub { display: none; }
      .logo-wrap { gap: 8px; }
      nav a { padding: 0 10px; font-size: 0.62rem; letter-spacing: 0.08em; height: 56px; }
      nav a.cta { padding: 0 12px; height: 30px; font-size: 0.62rem; margin-left: 6px; }
    }

    @media (max-width: 580px) {
      .masonry-gallery { column-count: 1; }
      .wrap { padding: 0 16px 40px; }
      .page-hero { padding: 40px 16px 20px; }
      .site-header { padding: 0 10px; height: 52px; }
      .logo-wrap video { height: 26px; }
      .logo-text { font-size: 0.88rem; }
      .logo-wrap { gap: 6px; }
      nav a { padding: 0 8px; font-size: 0.58rem; letter-spacing: 0.05em; height: 52px; border-left: none; }
      nav a.cta { padding: 0 10px; height: 28px; margin-left: 4px; font-size: 0.58rem; }
    }

    .lightbox { position: fixed; inset: 0; display: none; align-items: center; justify-content: center; background: rgba(10,8,6,0.95); z-index: 9000; padding: 20px; }
    .lightbox.open { display: flex; }
    .lightbox img { max-width: min(100%, 1100px); max-height: 88vh; border-radius: 3px; object-fit: contain; }
    .lb-btn { position: absolute; background: none; border: none; color: rgba(255,255,255,0.6); cursor: pointer; font-size: 36px; transition: color 0.2s; line-height: 1; }
    .lb-btn:hover { color: #fff; }
    .lb-close { top: 20px; right: 24px; font-size: 32px; }
    .lb-prev { left: 24px; top: 50%; transform: translateY(-50%); }
    .lb-next { right: 24px; top: 50%; transform: translateY(-50%); }
    .lb-counter { position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%); font-size: 0.75rem; letter-spacing: 0.2em; color: rgba(255,255,255,0.4); }

    footer { background: var(--dark); color: rgba(255,255,255,0.4); text-align: center; padding: 40px 20px; font-size: 0.78rem; letter-spacing: 0.12em; }
    footer a { color: var(--gold-light); text-decoration: none; }
  </style>

<div id="lightbox" class="lightbox">
  <button class="lb-btn lb-close">✕</button>
  <button class="lb-btn lb-prev">&#8592;</button>
  <img id="lb-img" alt="">
  <button class="lb-btn lb-next">&#8594;</button>
  <div class="lb-counter" id="lb-counter"></div>
</div>

<script>
  window.addEventListener("load", () => {
    const pre = document.getElementById("preloader"), con = document.getElementById("content");
    setTimeout(() => { pre.style.opacity = "0"; setTimeout(() => { pre.style.display = "none"; con.style.display = "block"; }, 800); }, 1200);
  });
  const lb = document.getElementById('lightbox'), lbImg = document.getElementById('lb-img'), lbCounter = document.getElementById('lb-counter');
  const imgs = [...document.querySelectorAll('img[data-lb]')];
  let cur = 0;
  function show(i) { cur = (i + imgs.length) % imgs.length; lbImg.src = imgs[cur].src; lbCounter.textContent = `${cur+1} / ${imgs.length}`; }
  function open(i) { show(i); lb.classList.add('open'); document.body.style.overflow = 'hidden'; }
  function close() { lb.classList.remove('open'); document.body.style.overflow = ''; }
  imgs.forEach((img, i) => img.addEventListener('click', () => open(i)));
  document.querySelector('.lb-close').addEventListener('click', close);
  document.querySelector('.lb-prev').addEventListener('click', (e) => { e.stopPropagation(); show(cur - 1); });
  document.querySelector('.lb-next').addEventListener('click', (e) => { e.stopPropagation(); show(cur + 1); });
  lb.addEventListener('click', (e) => { if (e.target === lb) close(); });
  document.addEventListener('keydown', (e) => { if (!lb.classList.contains('open')) return; if (e.key==='Escape') close(); if (e.key==='ArrowRight') show(cur+1); if (e.key==='ArrowLeft') show(cur-1); });
</script>
